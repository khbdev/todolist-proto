syntax = "proto3";

package create;

option go_package = "github.com/khbdev/todolist-proto/create/createpb";


service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message CreateUserResponse {
  string message = 1;
}